<!doctype html>
<html lang="zh-Hant">
    <!-- public/index.html -->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>方音圖鑑 - 工具</title>
        <meta name="description" content="拓展工具 - Praat聲學分析、語保詞彙語法、字表檢查、字表合併、粵拼轉IPA、自然村數據。提供方言研究的專業數據處理和分析工具。">
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <style>
            html, body, #app { min-height: 100%; margin: 0; }
            .app-boot-loading {
                position: fixed; inset: 0; z-index: 9999;
                display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
                background: radial-gradient(1200px 800px at 10% -10%, #dff1ff 0%, rgba(223,241,255,0) 60%), radial-gradient(1000px 700px at 110% 10%, #cfe7ff 0%, rgba(207,231,255,0) 60%), linear-gradient(180deg, #eaf5ff, #d7ecff);
                color: #0b2540;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            }
            .app-boot-spinner {
                width: 34px; height: 34px; border-radius: 999px;
                border: 3px solid rgba(0,122,255,0.18); border-top-color: rgba(0,122,255,0.9);
                animation: appBootSpin 0.8s linear infinite;
            }
            .app-boot-text { font-size: 14px; font-weight: 600; color: rgba(11,37,64,0.72); }
            @keyframes appBootSpin { to { transform: rotate(360deg); } }
        </style>
    </head>


  <body>
    <div id="app">
      <div class="app-boot-loading">
        <div class="app-boot-spinner"></div>
        <div class="app-boot-text">頁面載入中...</div>
      </div>
    </div>

    <script>
        (function() {
            var p = location.pathname;
            var m = p.match(/^\/(zh-CN|zh-Hant|en)(\/|$)/);
            var loc = m ? m[1] : 'zh-Hant';
            var page = p.replace(/^\/(zh-CN|zh-Hant|en)/, '').replace(/\/+$/, '') || '/';
            var base = 'https://dialects.yzup.top';

            document.documentElement.lang = loc;

            var c = document.createElement('link');
            c.rel = 'canonical';
            c.href = base + '/' + loc + (page === '/' ? '' : page);
            document.head.appendChild(c);

            ['zh-Hant', 'zh-CN', 'en'].forEach(function(l) {
                var a = document.createElement('link');
                a.rel = 'alternate';
                a.hreflang = l;
                a.href = base + '/' + l + (page === '/' ? '' : page);
                document.head.appendChild(a);
            });
            var x = document.createElement('link');
            x.rel = 'alternate';
            x.hreflang = 'x-default';
            x.href = base + '/zh-Hant' + (page === '/' ? '' : page);
            document.head.appendChild(x);

            var titles = { 'zh-Hant': '探索工具｜方音圖鑑', 'zh-CN': '探索工具｜方音图鉴', 'en': 'Explore Tools | Dialects Atlas' };
            if (titles[loc]) document.title = titles[loc];

            var oldDm = document.querySelector('meta[name="description"]');
            if (oldDm) oldDm.remove();
            var descs = { 'zh-Hant': '探索方音圖鑑的互動工具與資料集，包括地圖繪製、字表工具、自然村資料與語音分析等功能。', 'zh-CN': '探索方音图鉴的交互工具与数据集，包括地图绘制、字表工具、自然村资料与语音分析等功能。', 'en': 'Explore interactive tools and datasets in Dialects Atlas, including map drawing, table tools, village data, and phonetic analysis.' };
            if (descs[loc]) {
                var dm = document.createElement('meta');
                dm.name = 'description';
                dm.content = descs[loc];
                document.head.appendChild(dm);
            }
        })();
    </script>
    <script type="module" src="/src/main/main.js"></script>
  </body>
</html>
