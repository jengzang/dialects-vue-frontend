<!doctype html>
<html lang="zh-Hant">
    <head>

            {
                "@context": "https://schema.org",

                "name": "方音圖鑑",

        <style>
            html,
            body,
            #app {
                min-height: 100%;
                margin: 0;
            }

            .app-boot-loading {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                background:
                    radial-gradient(1200px 800px at 10% -10%, #dff1ff 0%, rgba(223, 241, 255, 0) 60%),
                    radial-gradient(1000px 700px at 110% 10%, #cfe7ff 0%, rgba(207, 231, 255, 0) 60%),
                    linear-gradient(180deg, #eaf5ff, #d7ecff);
                color: #0b2540;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            }

            .app-boot-spinner {
                width: 34px;
                height: 34px;
                border-radius: 999px;
                border: 3px solid rgba(0, 122, 255, 0.18);
                border-top-color: rgba(0, 122, 255, 0.9);
                animation: appBootSpin 0.8s linear infinite;
            }

            .app-boot-text {
                font-size: 14px;
                font-weight: 600;
                color: rgba(11, 37, 64, 0.72);
            }

            @keyframes appBootSpin {
                to {
                    transform: rotate(360deg);
                }
            }

            .app-boot-seo {
                overflow-y: auto;
                justify-content: safe center;
                padding: 24px;
                text-align: center;
                box-sizing: border-box;
            }

            .app-boot-title {
                margin: 0;
                font-size: 30px;
                font-weight: 800;
                letter-spacing: 0.04em;
                color: #0b2540;
            }

            .app-boot-desc {
                max-width: 720px;
                margin: 0;
                font-size: 15px;
                line-height: 1.8;
                color: rgba(11, 37, 64, 0.78);
            }

            .app-boot-links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                max-width: 760px;
                margin: 0;
            }

            .app-boot-links a {
                display: inline-flex;
                align-items: center;
                min-height: 32px;
                padding: 0 12px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.58);
                color: #007aff;
                font-size: 14px;
                font-weight: 600;
                text-decoration: none;
                box-shadow: inset 0 0 0 1px rgba(0, 122, 255, 0.14);
            }

            .app-boot-links a:hover {
                background: rgba(255, 255, 255, 0.82);
            }

            .app-boot-seo noscript {
                display: block;
                max-width: 720px;
                margin: 0;
                font-size: 14px;
                line-height: 1.7;
                color: rgba(11, 37, 64, 0.72);
            }
        </style>
    </head>


  <body>
    <div id="app">
      <main class="app-boot-loading app-boot-seo">
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <h1 class="app-boot-title">方音圖鑑</h1>
        <p class="app-boot-desc">方音圖鑑是一個漢語方言音韻查詢、方言比較、音系分析與地理可視化平台。提供查字、查中古、查音位、查調、方言比較、音系、音節統計、方言地圖、Praat 聲學分析、字表工具與自然村資料分析等功能。</p>
        <nav class="app-boot-links" aria-label="主要功能">
          <a href="/zh-Hant/menu/query/char/">查字</a>
          <a href="/zh-Hant/menu/query/zhonggu/">查中古</a>
          <a href="/zh-Hant/menu/compare/">方言比較</a>
          <a href="/zh-Hant/menu/pho">音系</a>
          <a href="/zh-Hant/menu/map/view/">方言地圖</a>
          <a href="/zh-Hant/explore/tools/praat/">Praat 聲學分析</a>
          <a href="/zh-Hant/explore/tools/check/">字表工具</a>
          <a href="/zh-Hant/explore/villages/gd">自然村分析</a>
        </nav>
        <p class="app-boot-text">頁面載入中...</p>
        <noscript>
          <p>本網站需要 JavaScript 才能使用完整的方言查詢、比較、地圖和聲學分析功能。你仍可通過上方鏈接瀏覽主要工具入口。</p>
        </noscript>
      </main>
    </div>
    <script>
        (function() {
            var p = location.pathname;
            var m = p.match(/^\/(zh-CN|zh-Hant|en)(\/|$)/);
            var loc = m ? m[1] : 'zh-Hant';
            var page = p.replace(/^\/(zh-CN|zh-Hant|en)/, '').replace(/\/+$/, '') || '/';
            var base = 'https://dialects.yzup.top';

            // --- <head> ---
            document.documentElement.lang = loc;

            var c = document.createElement('link');
            c.rel = 'canonical';
            c.href = base + '/' + loc + (page === '/' ? '' : page);
            document.head.appendChild(c);

            ['zh-Hant', 'zh-CN', 'en'].forEach(function(l) {
                var a = document.createElement('link');
                a.rel = 'alternate';
                a.hreflang = l;
                a.href = base + '/' + l + (page === '/' ? '' : page);
                document.head.appendChild(a);
            });
            var x = document.createElement('link');
            x.rel = 'alternate';
            x.hreflang = 'x-default';
            x.href = base + '/zh-Hant' + (page === '/' ? '' : page);
            document.head.appendChild(x);

            var titles = { 'zh-Hant': '方音圖鑑｜方言比較 · 地理語言學', 'zh-CN': '方音图鉴｜方言比较 · 地理语言学', 'en': 'Dialects Atlas | Dialect Comparison · Geolinguistics' };
            if (titles[loc]) document.title = titles[loc];

            var oldDm = document.querySelector('meta[name="description"]');
            if (oldDm) oldDm.remove();
            var descs = { 'zh-Hant': '方音圖鑑是一個專注於方言比較與地理語言學的線上平台，提供查字、查中古、查音位、查調、音系分析、方言比較、地圖可視化與自然村資料等功能。', 'zh-CN': '方音图鉴是一个专注于方言比较与地理语言学的在线平台，提供查字、查中古、查音位、查调、音系分析、方言比较、地图可视化与自然村资料等功能。', 'en': 'Dialects Atlas is an online platform focused on dialect comparison and geolinguistics, offering character lookup, Middle Chinese query, phoneme analysis, tone query, phonology analysis, dialect comparison, map visualization, and village datasets.' };
            if (descs[loc]) {
                var dm = document.createElement('meta');
                dm.name = 'description';
                dm.content = descs[loc];
                document.head.appendChild(dm);
            }

            // --- <body> ---
            var h1Texts = { 'zh-Hant': '方音圖鑑', 'zh-CN': '方音图鉴', 'en': 'Dialects Atlas' };
            var h1 = document.querySelector('.app-boot-title');
            if (h1 && h1Texts[loc]) h1.textContent = h1Texts[loc];

            var bd = document.querySelector('.app-boot-desc');
            var bodyDescs = { 'zh-Hant': '方音圖鑑是一個漢語方言音韻查詢、方言比較、音系分析與地理可視化平台。提供查字、查中古、查音位、查調、方言比較、音系、音節統計、方言地圖、Praat 聲學分析、字表工具與自然村資料分析等功能。', 'zh-CN': '方音图鉴是一个汉语方言音韵查询、方言比较、音系分析与地理可视化平台。提供查字、查中古、查音位、查调、方言比较、音系、音节统计、方言地图、Praat 声学分析、字表工具与自然村资料分析等功能。', 'en': 'Dialects Atlas is a platform for Chinese dialect phonology query, dialect comparison, phonemic analysis, and geolinguistic visualization, featuring character lookup, Middle Chinese query, phoneme & tone analysis, phonology, syllable statistics, dialect maps, Praat acoustic analysis, character table tools, and village data analysis.' };
            if (bd && bodyDescs[loc]) bd.textContent = bodyDescs[loc];

            var lt = document.querySelector('.app-boot-text');
            var loadingTexts = { 'zh-Hant': '頁面載入中...', 'zh-CN': '页面加载中...', 'en': 'Loading...' };
            if (lt && loadingTexts[loc]) lt.textContent = loadingTexts[loc];

            var nav = document.querySelector('.app-boot-links');
            if (nav) {
                var navLabels = { 'zh-Hant': '主要功能', 'zh-CN': '主要功能', 'en': 'Main Features' };
                if (navLabels[loc]) nav.setAttribute('aria-label', navLabels[loc]);
                var links = nav.querySelectorAll('a');
                var linkTexts = {
                    'zh-Hant': ['查字', '查中古', '方言比較', '音系', '方言地圖', 'Praat 聲學分析', '字表工具', '自然村分析'],
                    'zh-CN': ['查字', '查中古', '方言比较', '音系', '方言地图', 'Praat 声学分析', '字表工具', '自然村分析'],
                    'en': ['Char Lookup', 'MC Query', 'Comparison', 'Phonology', 'Dialect Map', 'Praat', 'Table Tools', 'Village Data']
                };
                for (var i = 0; i < links.length; i++) {
                    links[i].href = links[i].getAttribute('href').replace(/^\/zh-(?:CN|Hant)\//, '/' + loc + '/');
                    if (linkTexts[loc] && linkTexts[loc][i]) links[i].textContent = linkTexts[loc][i];
                }
            }

            var np = document.querySelector('noscript p');
            var noscriptTexts = { 'zh-Hant': '本網站需要 JavaScript 才能使用完整的方言查詢、比較、地圖和聲學分析功能。你仍可通過上方鏈接瀏覽主要工具入口。', 'zh-CN': '本网站需要 JavaScript 才能使用完整的方言查询、比较、地图和声学分析功能。你仍可通过上方链接浏览主要工具入口。', 'en': 'JavaScript is required for the full dialect query, comparison, map, and acoustic analysis features. You can still browse the main tool entries via the links above.' };
            if (np && noscriptTexts[loc]) np.textContent = noscriptTexts[loc];
        })();
    </script>
    <script type="module" src="./src/main/main.js"></script>
  </body>
</html>
